name: docs

on:
  pull_request:
    branches:
      - '*'
  workflow_dispatch:
  push:
    branches:
      - 'docs/*'
  release:
    types:
      - published

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs-checks:
    name: Run doc build and create artifact
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: "0"
          submodules: recursive
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.10
      - name: Install LLVM and Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-14 llvm-14-dev libpolly-14-dev clang-14 lld-14
          echo "LLVM_SYS_140_PREFIX=/usr/lib/llvm-14" >> "$GITHUB_ENV"
          echo "/usr/lib/llvm-14/bin" >> "$GITHUB_PATH"
      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - name: Setup dependencies.
        run: uv sync --python 3.13
      - name: Build docs
        run: |
          uv pip install -e .
          uv run --group docs sphinx-build -M html docs docs/_build
      - uses: actions/upload-artifact@v7
        with:
          name: docs
          path: docs/_build/html/
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html/
      - name: Deploy to GitHub Pages
        if: github.event_name == 'release'
        id: deployment
        uses: actions/deploy-pages@v5
