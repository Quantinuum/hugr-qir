[package]
name = "hugr-qir"
version = "0.0.21-rc.1"
edition = "2024"
rust-version = "1.85"

[features]
default = ["py"]
py = ["dep:pyo3"]

[dependencies]
anyhow = "1.0.101"
clap = "4.5.59"
clap-verbosity-flag = "3.0.4"
clio = { version = "0.3.5", features = ["clap-parse"] }
hugr = { version = "0.24.3", features = ["llvm"] }
hugr-cli = "0.24.3"
hugr-core = "0.24.3"
hugr-llvm = { version = "0.24.3", features = ["test-utils"] }
inkwell = { version = "0.6.0", features = ["llvm14-0"] }
itertools = "0.14.0"
lazy_static = "1.5.0"
petgraph = { version = ">= 0.8.1, < 0.9", default-features = false }
pyo3 = { version = "0.28", features = [
    "abi3-py310",
    "anyhow",
], optional = true }
serde = "1.0.228"
tket = "0.16.0"
tket-qsystem = { version = "0.22.0", features = ["cli"] }
wasmparser = { version = "0.245", default-features = false }

[dev-dependencies]
insta = "1.46.3"
rstest = "0.26.1"
serde = { version = "1.0.228", features = ["derive"] }
typetag = "0.2.21"
